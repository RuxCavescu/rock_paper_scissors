<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Rock Paper Scissors</h1>
      </header>

      <div class="game-area">
        <div class="score-board">
          <div class="score">
            <span>Player: <span id="player-score">0</span></span>
            <span>Computer: <span id="computer-score">0</span></span>
          </div>
        </div>

        <div class="game-display">
          <div class="player-choice">
            <h3>You</h3>
            <div id="player-choice-display" class="choice-display">?</div>
          </div>

          <div class="vs">VS</div>

          <div class="computer-choice">
            <h3>Computer</h3>
            <div id="computer-choice-display" class="choice-display">?</div>
          </div>
        </div>

        <div class="choices">
          <button class="choice-btn" data-choice="rock">
            <span class="choice-icon">🪨</span>
            <span class="choice-name">Rock</span>
          </button>
          <button class="choice-btn" data-choice="paper">
            <span class="choice-icon">📄</span>
            <span class="choice-name">Paper</span>
          </button>
          <button class="choice-btn" data-choice="scissors">
            <span class="choice-icon">✂️</span>
            <span class="choice-name">Scissors</span>
          </button>
        </div>

        <div class="result">
          <p id="game-result"></p>
        </div>

        <div class="controls">
          <button id="reset-btn" class="reset-btn">Reset Game</button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
